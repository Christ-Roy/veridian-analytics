name: tmp-login-v4-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: login v4 (mêmes entrées que le job docker)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - name: preuve — pull d'un manifest privé GHCR authentifié
        run: |
          docker manifest inspect ghcr.io/christ-roy/analytics:latest > /dev/null \
            && echo "AUTH GHCR OK (manifest lu)" || echo "manifest KO"
          grep -o '"ghcr.io"' ~/.docker/config.json && echo "credential ghcr.io présent dans config.json"

# test-coverage-map.yaml — Standard CI Veridian §1
#
# Déclare ici les fichiers critiques qui ne suivent PAS la convention canonique
# de chemin (1 source → 1 test colocalisé au même chemin) mais sont légitimement
# couverts par un test situé ailleurs (ex : test integration qui exerce un helper).
#
# Le hook pre-push check-test-mapping.sh lit ce fichier comme fallback :
# si une source modifiée n'a pas de test colocalisé, il cherche ici.
# Au moins UN des `covered_by` doit être modifié dans la même PR.
#
# Format strict :
# - sources:
#     - <chemin/source/relatif.ts>
#   covered_by:
#     - <chemin/test/relatif.test.ts>
#   reason: |
#     Justification écrite. Pas de "TODO refactor", expliquer POURQUOI ce test
#     couvre fonctionnellement le code source.
#
# Renovate et agents auto ne peuvent pas ajouter de couverture sans toucher
# ce fichier. Reviewable comme du code.

# ─── D1 — URL shortener interne (lnk.veridian.site) ──────────────────────────
- sources:
    - lib/short-links.ts
  covered_by:
    - tests/unit/short-links.test.ts
    - tests/unit/r-redirect.test.ts
    - tests/unit/short-links-admin-api.test.ts
  reason: |
    Le repo utilise `tests/unit/<name>.test.ts` (pas __tests__/) comme
    convention historique (cf. tous les tests unitaires existants).
    Les helpers purs (slugFromUrl, buildRedirectUrl, isValidTargetUrl)
    sont couverts par short-links.test.ts. resolveShortLink (cache-wrapped)
    est exerce indirectement par r-redirect.test.ts via le handler GET.

- sources:
    - app/api/admin/short-links/route.ts
    - app/api/admin/short-links/[id]/route.ts
    - app/api/admin/short-links/[id]/stats/route.ts
  covered_by:
    - tests/unit/short-links-admin-api.test.ts
    - tests/e2e/12-url-shortener.spec.ts
  reason: |
    Les routes admin sont couvertes par un test unitaire complet
    (short-links-admin-api.test.ts) qui mock prisma + auth et exerce
    GET/POST/PATCH/DELETE + endpoint stats. Le test e2e Playwright
    valide le flow integre (create -> redirect -> stats).
